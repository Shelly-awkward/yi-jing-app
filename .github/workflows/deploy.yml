name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 注入 API Keys
        run: |
          sed -i "s/YOUR_ANTHROPIC_KEY_HERE/${{ secrets.ANTHROPIC_API_KEY }}/g" index.html
          sed -i "s/YOUR_GEMINI_KEY_HERE/${{ secrets.GEMINI_API_KEY }}/g" index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
